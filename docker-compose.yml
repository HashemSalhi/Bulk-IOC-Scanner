services:
  bulk-ioc-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/hashemsalhi/bulk-ioc-scanner:latest
    ports:
      - "8000:8000"
    volumes:
      # Scan history and API keys. Delete this volume to start clean.
      - scanner_data:/data
    env_file:
      # Optional. Keys are usually added on the Settings page instead; either
      # way they persist in the volume.
      - path: .env
        required: false
    restart: unless-stopped

volumes:
  scanner_data:

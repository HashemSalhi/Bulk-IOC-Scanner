name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # The launcher and the data directory are platform-specific, so prove
        # the suite on the other two as well — on one version, to keep it quick.
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  ui:
    name: Web UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Check the build landed inside the Python package
        run: test -f backend/bulk_ioc_scanner/web/index.html

  package:
    name: Package builds and serves the UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the UI into the package
        run: npm ci && npm run build
        working-directory: frontend

      - name: Build the wheel
        run: pip install build && python -m build --wheel

      - name: Confirm the UI is inside the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "bulk_ioc_scanner/web/index.html" in names, f"UI missing from {wheel}"
          print(f"{wheel} contains the built UI")
          PY

      - name: Install the wheel and start it
        run: |
          pip install dist/*.whl
          bulk-ioc-scanner --no-browser --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done

      - name: Check it serves the UI and the API on one port
        run: |
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl -sf http://127.0.0.1:8000/scan | grep -q '<div id="root">'
          curl -sf http://127.0.0.1:8000/api/settings | grep -q providers

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bulk-ioc-scanner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it
        run: |
          docker run -d --name scanner -p 8000:8000 bulk-ioc-scanner:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'
          docker rm -f scanner
